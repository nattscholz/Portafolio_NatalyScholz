<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{general/fragmentos :: head}">
        <title>TechShop</title>
    </head>

    <body>

        <header th:replace="~{general/fragmentos :: header}"></header>

        <main class="container mt-5">

            <div class="row justify-content-center">

                <div class="col-md-5">

                    <div class="card shadow">

                        <div class="card-header bg-success text-white text-center">
                            <h4 class="mb-0">
                                <i class="fa-solid fa-user-lock"></i>
                                Iniciar sesión
                            </h4>
                        </div>

                        <div class="card-body">

                            <div th:if="${param.error}" class="alert alert-danger">
                                Usuario o contraseña incorrectos.
                            </div>

                            <div th:if="${param.logout}" class="alert alert-success">
                                Sesión cerrada correctamente.
                            </div>

                            <div th:if="${param.expired}" class="alert alert-warning">
                                La sesión expiró.
                            </div>

                            <form th:action="@{/login}" method="post">

                                <div class="mb-3">
                                    <label for="username" class="form-label">
                                        Usuario
                                    </label>

                                    <input type="text"
                                           id="username"
                                           name="username"
                                           class="form-control"
                                           required="true"
                                           autofocus="true"/>
                                </div>

                                <div class="mb-3">
                                    <label for="password" class="form-label">
                                        Contraseña
                                    </label>

                                    <input type="password"
                                           id="password"
                                           name="password"
                                           class="form-control"
                                           required="true"/>
                                </div>

                                <div class="d-grid">
                                    <button type="submit" class="btn btn-success">
                                        <i class="fa-solid fa-right-to-bracket"></i>
                                        Ingresar
                                    </button>
                                </div>

                            </form>

                        </div>

                        <div class="card-footer text-center">
                            <small class="text-muted">
                                Usuarios de prueba: juan, rebeca, pedro / contraseña: 123
                            </small>
                        </div>

                    </div>

                </div>

            </div>

        </main>

        <footer th:replace="~{general/fragmentos :: footer}"></footer>

    </body>
</html>
