<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{general/fragmentos :: head}">
</head>

<body>

<header th:replace="~{general/fragmentos :: header}"></header>

<main class="container mt-4 mb-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3 class="mb-0"
                th:text="${cliente.idCliente == null
                    ? 'Agregar cliente'
                    : 'Modificar cliente'}">

                Cliente

            </h3>

        </div>

        <div class="card-body">

            <form th:action="@{/cliente/guardar}"
                  th:object="${cliente}"
                  method="post"
                  enctype="multipart/form-data">

                <input type="hidden"
                       th:field="*{idCliente}">

                <input type="hidden"
                       th:field="*{rutaImagen}">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label for="nombre"
                               class="form-label">
                            Nombre
                        </label>

                        <input id="nombre"
                               type="text"
                               class="form-control"
                               th:field="*{nombre}"
                               maxlength="50"
                               required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label for="apellidos"
                               class="form-label">
                            Apellidos
                        </label>

                        <input id="apellidos"
                               type="text"
                               class="form-control"
                               th:field="*{apellidos}"
                               maxlength="50"
                               required>

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label for="correo"
                               class="form-label">
                            Correo electrónico
                        </label>

                        <input id="correo"
                               type="email"
                               class="form-control"
                               th:field="*{correo}"
                               maxlength="100"
                               required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label for="telefono"
                               class="form-label">
                            Teléfono
                        </label>

                        <input id="telefono"
                               type="text"
                               class="form-control"
                               th:field="*{telefono}"
                               maxlength="20"
                               placeholder="8888-8888">

                    </div>

                </div>

                <div class="mb-3">

                    <label for="direccion"
                           class="form-label">
                        Dirección
                    </label>

                    <textarea id="direccion"
                              class="form-control"
                              th:field="*{direccion}"
                              rows="3"
                              maxlength="255">
                    </textarea>

                </div>

                <div class="mb-3">

                    <label for="imagenFile"
                           class="form-label">
                        Imagen
                    </label>

                    <input id="imagenFile"
                           class="form-control"
                           type="file"
                           name="imagenFile"
                           accept="image/*">

                    <small class="form-text text-muted"
                           th:if="${cliente.idCliente != null}">

                        Selecciona una imagen solamente si deseas reemplazar la actual.

                    </small>

                </div>

                <div class="mb-3 text-center"
                     th:if="${cliente.rutaImagen != null
                        and !#strings.isEmpty(cliente.rutaImagen)}">

                    <p class="mb-2">
                        Imagen actual
                    </p>

                    <img th:src="${cliente.rutaImagen}"
                         alt="Imagen actual del cliente"
                         width="120"
                         height="120"
                         class="rounded-circle object-fit-cover border">

                </div>

                <div class="form-check mb-4">

                    <input id="activo"
                           class="form-check-input"
                           type="checkbox"
                           th:field="*{activo}">

                    <label for="activo"
                           class="form-check-label">

                        Cliente activo

                    </label>

                </div>

                <div class="d-flex gap-2">

                    <button class="btn btn-success"
                            type="submit">

                        <i class="fas fa-save me-1"></i>
                        Guardar

                    </button>

                    <a th:href="@{/cliente/listado}"
                       class="btn btn-secondary">

                        Cancelar

                    </a>

                </div>

            </form>

        </div>

    </div>

</main>

<footer th:replace="~{general/fragmentos :: footer}"></footer>

</body>

</html>
