<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{general/fragmentos :: head}"/>

    <body>

        <header th:replace="~{general/fragmentos :: header}"/>

        <section class="py-4 bg-success text-white">
            <div class="container">
                <h1>
                    <i class="fa-solid fa-cart-shopping"></i>
                    Carrito de compras
                </h1>
            </div>
        </section>

        <section class="container mt-4">

            <div th:if="${todoOk}" class="alert alert-success">
                <span th:text="${todoOk}"></span>
            </div>

            <div th:if="${error}" class="alert alert-danger">
                <span th:text="${error}"></span>
            </div>

            <div class="row">

                <div class="col-md-9">

                    <div class="card">
                        <div class="card-header">
                            Productos en el carrito
                        </div>

                        <div class="card-body">

                            <div th:if="${items == null or items.isEmpty()}">
                                <p class="text-center">
                                    El carrito está vacío.
                                </p>
                            </div>

                            <table class="table table-striped" th:if="${items != null and !items.isEmpty()}">
                                <thead>
                                    <tr>
                                        <th>Producto</th>
                                        <th>Precio</th>
                                        <th>Cantidad</th>
                                        <th>Subtotal</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>

                                <tbody>
                                    <tr th:each="item : ${items}">
                                        <td th:text="${item.producto.descripcion}"></td>
                                        <td th:text="${item.precioHistorico}"></td>

                                        <td>
                                            <form th:action="@{/carrito/actualizar}" method="post" class="d-flex">
                                                <input type="hidden" name="idProducto"
                                                       th:value="${item.producto.idProducto}"/>

                                                <input type="number"
                                                       name="cantidad"
                                                       min="1"
                                                       class="form-control me-2"
                                                       th:value="${item.cantidad}"/>

                                                <button type="submit" class="btn btn-warning btn-sm">
                                                    Actualizar
                                                </button>
                                            </form>
                                        </td>

                                        <td th:text="${item.subTotal}"></td>

                                        <td>
                                            <form th:action="@{/carrito/eliminar}" method="post">
                                                <input type="hidden" name="idProducto"
                                                       th:value="${item.producto.idProducto}"/>

                                                <button type="submit" class="btn btn-danger btn-sm">
                                                    Eliminar
                                                </button>
                                            </form>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>

                        </div>
                    </div>

                </div>

                <div class="col-md-3">

                    <div class="card text-center">
                        <div class="card-header bg-info text-white">
                            Resumen
                        </div>

                        <div class="card-body">
                            <h5>Total de productos</h5>
                            <h3 th:text="${cantidadItems}"></h3>

                            <hr/>

                            <h5>Total a pagar</h5>
                            <h3 th:text="${total}"></h3>

                            <form th:action="@{/carrito/facturar}" method="post" class="mt-3">
                                <button type="submit"
                                        class="btn btn-success w-100"
                                        th:disabled="${items == null or items.isEmpty()}">
                                    Facturar
                                </button>
                            </form>

                            <form th:action="@{/carrito/limpiar}" method="post" class="mt-2">
                                <button type="submit"
                                        class="btn btn-secondary w-100"
                                        th:disabled="${items == null or items.isEmpty()}">
                                    Limpiar carrito
                                </button>
                            </form>

                            <a th:href="@{/producto/listado}" class="btn btn-primary w-100 mt-2">
                                Seguir comprando
                            </a>
                        </div>
                    </div>

                </div>

            </div>

        </section>

        <footer th:replace="~{general/fragmentos :: footer}"/>

    </body>
</html>
