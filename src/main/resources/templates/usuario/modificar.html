<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{general/fragmentos :: head}">
</head>

<body>

<header th:replace="~{general/fragmentos :: header}"></header>

<main class="container mt-4 mb-5">

    <div class="card shadow">

        <div class="card-header bg-success text-white">

            <h3 class="mb-0"
                th:text="${usuario.idUsuario == null
                    ? 'Agregar usuario'
                    : 'Modificar usuario'}">

                Usuario

            </h3>

        </div>

        <div class="card-body">

            <form th:action="@{/usuario/guardar}"
                  th:object="${usuario}"
                  method="post"
                  enctype="multipart/form-data">

                <input type="hidden"
                       th:field="*{idUsuario}">

                <input type="hidden"
                       th:field="*{rutaImagen}">

                <div class="mb-3">

                    <label for="nombre"
                           class="form-label">
                        Nombre
                    </label>

                    <input id="nombre"
                           type="text"
                           class="form-control"
                           th:field="*{nombre}"
                           required>

                </div>

                <div class="mb-3">

                    <label for="username"
                           class="form-label">
                        Usuario
                    </label>

                    <input id="username"
                           type="text"
                           class="form-control"
                           th:field="*{username}"
                           required>

                </div>

                <div class="mb-3">

                    <label for="correo"
                           class="form-label">
                        Correo electrónico
                    </label>

                    <input id="correo"
                           type="email"
                           class="form-control"
                           th:field="*{correo}"
                           required>

                </div>

                <div class="mb-3">

                    <label for="password"
                           class="form-label">

                        Contraseña

                    </label>

                    <input id="password"
                           type="password"
                           class="form-control"
                           th:field="*{password}"
                           th:required="${usuario.idUsuario == null}">

                    <small class="form-text text-muted"
                           th:if="${usuario.idUsuario != null}">

                        Deja este campo vacío para conservar la contraseña actual.

                    </small>

                </div>

                <div class="mb-3">

                    <label for="rolSeleccionado"
                           class="form-label">
                        Rol
                    </label>

                    <select id="rolSeleccionado"
                            class="form-select"
                            name="rolSeleccionado"
                            required>

                        <option value="">
                            Selecciona un rol
                        </option>

                        <option th:each="r : ${roles}"
                                th:value="${r.nombre}"
                                th:text="${r.nombre}"
                                th:selected="${usuario.roles != null
                                    and usuario.roles.contains(r)}">

                            Rol

                        </option>

                    </select>

                </div>

                <div class="mb-3">

                    <label for="imagenFile"
                           class="form-label">
                        Imagen
                    </label>

                    <input id="imagenFile"
                           class="form-control"
                           type="file"
                           name="imagenFile"
                           accept="image/*">

                    <small class="form-text text-muted"
                           th:if="${usuario.idUsuario != null}">

                        Selecciona una imagen únicamente si deseas reemplazar la actual.

                    </small>

                </div>

                <div class="mb-3 text-center"
                     th:if="${usuario.rutaImagen != null
                        and !#strings.isEmpty(usuario.rutaImagen)}">

                    <p class="mb-2">
                        Imagen actual
                    </p>

                    <img th:src="${usuario.rutaImagen}"
                         alt="Imagen actual del usuario"
                         width="120"
                         height="120"
                         class="rounded-circle object-fit-cover border">

                </div>

                <div class="form-check mb-4">

                    <input id="activo"
                           class="form-check-input"
                           type="checkbox"
                           th:field="*{activo}">

                    <label for="activo"
                           class="form-check-label">

                        Usuario activo

                    </label>

                </div>

                <div class="d-flex gap-2">

                    <button class="btn btn-success"
                            type="submit">

                        <i class="fas fa-save me-1"></i>
                        Guardar

                    </button>

                    <a th:href="@{/usuario/listado}"
                       class="btn btn-secondary">

                        Cancelar

                    </a>

                </div>

            </form>

        </div>

    </div>

</main>

<footer th:replace="~{general/fragmentos :: footer}"></footer>

</body>

</html>
