<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{general/fragmentos :: head}"></head>

    <body>
        <header th:replace="~{general/fragmentos :: header}"></header>

        <main class="container mt-5">

            <h2>Modificar Categoría</h2>

            <form th:action="@{/categoria/guardar}"
                  th:object="${categoria}"
                  method="post"
                  enctype="multipart/form-data">

                <input type="hidden" th:field="*{idCategoria}"/>

                <div class="mb-3">
                    <label class="form-label">Descripción</label>
                    <input type="text"
                           class="form-control"
                           th:field="*{descripcion}"
                           required="true"/>
                </div>

                <div class="mb-3">
                    <label class="form-label">Imagen</label>
                    <input type="file"
                           class="form-control"
                           name="imagenFile"
                           accept="image/*"/>
                </div>

                <div class="mb-3 form-check">
                    <input type="checkbox"
                           class="form-check-input"
                           th:field="*{activo}"/>
                    <label class="form-check-label">Activa</label>
                </div>

                <div class="mb-3" th:if="${categoria.rutaImagen != null}">
                    <label class="form-label">Imagen actual</label>
                    <br/>
                    <img th:src="${categoria.rutaImagen}"
                         alt="Imagen actual"
                         style="max-width: 250px;"/>
                </div>

                <button type="submit" class="btn btn-success">
                    Guardar
                </button>

                <a th:href="@{/categoria/listado}" class="btn btn-secondary">
                    Regresar
                </a>

            </form>

        </main>

        <footer th:replace="~{general/fragmentos :: footer}"></footer>
    </body>
</html>
