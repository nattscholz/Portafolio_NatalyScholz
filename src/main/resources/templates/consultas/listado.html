<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{general/fragmentos :: head}"/>

    <body>

        <header th:replace="~{general/fragmentos :: header}"/>

        <section class="py-4 bg-success text-white">
            <div class="container">
                <div class="row">
                    <div class="col-md-12">
                        <h1>
                            <i class="fa-solid fa-magnifying-glass"></i>
                            Consultas de productos
                        </h1>
                    </div>
                </div>
            </div>
        </section>

        <section class="container mt-4">

            <div class="row mb-4">
                <div class="col-md-12">
                    <h3>Filtrar productos por rango de precio</h3>
                    <p>
                        Ingrese un precio mínimo y un precio máximo para consultar productos.
                    </p>
                </div>
            </div>

            <div class="row mb-4">

                <div class="col-md-4">
                    <div class="card">
                        <div class="card-header bg-primary text-white">
                            Consulta derivada
                        </div>
                        <div class="card-body">
                            <form th:action="@{/consultas/consultaDerivada}" method="post">
                                <div class="mb-3">
                                    <label>Precio mínimo</label>
                                    <input type="number" step="0.01" name="precioInf" class="form-control" required/>
                                </div>

                                <div class="mb-3">
                                    <label>Precio máximo</label>
                                    <input type="number" step="0.01" name="precioSup" class="form-control" required/>
                                </div>

                                <button type="submit" class="btn btn-primary">
                                    Consultar
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card">
                        <div class="card-header bg-warning text-dark">
                            Consulta JPQL
                        </div>
                        <div class="card-body">
                            <form th:action="@{/consultas/consultaJPQL}" method="post">
                                <div class="mb-3">
                                    <label>Precio mínimo</label>
                                    <input type="number" step="0.01" name="precioInf" class="form-control" required/>
                                </div>

                                <div class="mb-3">
                                    <label>Precio máximo</label>
                                    <input type="number" step="0.01" name="precioSup" class="form-control" required/>
                                </div>

                                <button type="submit" class="btn btn-warning">
                                    Consultar
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card">
                        <div class="card-header bg-danger text-white">
                            Consulta SQL
                        </div>
                        <div class="card-body">
                            <form th:action="@{/consultas/consultaSQL}" method="post">
                                <div class="mb-3">
                                    <label>Precio mínimo</label>
                                    <input type="number" step="0.01" name="precioInf" class="form-control" required/>
                                </div>

                                <div class="mb-3">
                                    <label>Precio máximo</label>
                                    <input type="number" step="0.01" name="precioSup" class="form-control" required/>
                                </div>

                                <button type="submit" class="btn btn-danger">
                                    Consultar
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

            </div>

            <div class="row">

                <div class="col-md-9">
                    <div class="card">
                        <div class="card-header">
                            Listado de productos
                        </div>

                        <div class="card-body">
                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Descripción</th>
                                        <th>Precio</th>
                                        <th>Existencias</th>
                                        <th>Activo</th>
                                    </tr>
                                </thead>

                                <tbody>
                                    <tr th:each="producto : ${productos}">
                                        <td th:text="${producto.idProducto}"></td>
                                        <td th:text="${producto.descripcion}"></td>
                                        <td th:text="${producto.precio}"></td>
                                        <td th:text="${producto.existencias}"></td>
                                        <td th:text="${producto.activo}"></td>
                                    </tr>
                                </tbody>
                            </table>

                            <div th:if="${productos == null or productos.isEmpty()}">
                                <p class="text-center">
                                    No hay productos para mostrar.
                                </p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card bg-success text-white text-center">
                        <div class="card-body">
                            <h4>Total productos</h4>
                            <h2 th:text="${totalProductos}"></h2>
                        </div>
                    </div>
                </div>

            </div>

        </section>

        <footer th:replace="~{general/fragmentos :: footer}"/>

    </body>
</html>
