<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

    <body>

        <!-- Fragmento agregar constante -->
        <section th:fragment="agregar" class="py-4 mb-4 bg-light">
            <div class="container">

                <div class="row">
                    <div class="col-md-9">
                        <h2>Constantes</h2>
                        <p>Administración de constantes utilizadas por el sistema.</p>
                    </div>

                    <div class="col-md-3 text-end">
                        <button type="button"
                                class="btn btn-primary"
                                data-bs-toggle="modal"
                                data-bs-target="#agregarConstante">
                            <i class="fa-solid fa-plus"></i>
                            Agregar constante
                        </button>
                    </div>
                </div>

                <!-- Modal agregar constante -->
                <div class="modal fade"
                     id="agregarConstante"
                     tabindex="-1"
                     aria-labelledby="agregarConstanteLabel"
                     aria-hidden="true">

                    <div class="modal-dialog modal-lg">
                        <div class="modal-content">

                            <form th:action="@{/constante/guardar}"
                                  method="post"
                                  th:object="${constante}">

                                <div class="modal-header bg-primary text-white">
                                    <h5 class="modal-title" id="agregarConstanteLabel">
                                        Agregar constante
                                    </h5>

                                    <button type="button"
                                            class="btn-close"
                                            data-bs-dismiss="modal"
                                            aria-label="Close">
                                    </button>
                                </div>

                                <div class="modal-body">

                                    <div class="mb-3">
                                        <label class="form-label">Atributo</label>
                                        <input type="text"
                                               class="form-control"
                                               th:field="*{atributo}"
                                               required/>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label">Valor</label>
                                        <input type="text"
                                               class="form-control"
                                               th:field="*{valor}"
                                               required/>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label">Descripción</label>
                                        <textarea class="form-control"
                                                  th:field="*{descripcion}"
                                                  rows="3">
                                        </textarea>
                                    </div>

                                    <div class="form-check">
                                        <input class="form-check-input"
                                               type="checkbox"
                                               th:field="*{activo}"/>

                                        <label class="form-check-label">
                                            Activo
                                        </label>
                                    </div>

                                </div>

                                <div class="modal-footer">
                                    <button type="button"
                                            class="btn btn-secondary"
                                            data-bs-dismiss="modal">
                                        Cancelar
                                    </button>

                                    <button type="submit"
                                            class="btn btn-primary">
                                        Guardar
                                    </button>
                                </div>

                            </form>

                        </div>
                    </div>
                </div>

            </div>
        </section>


        <!-- Fragmento listado de constantes -->
        <section th:fragment="listado" class="container mb-5">

            <div class="row mb-3">
                <div class="col-md-9">
                    <h3>Listado de constantes</h3>
                </div>

                <div class="col-md-3 text-end">
                    <span class="badge bg-success fs-6">
                        Total:
                        <span th:text="${totalConstantes}"></span>
                    </span>
                </div>
            </div>

            <div class="card">
                <div class="card-body">

                    <div th:if="${constantes == null or constantes.isEmpty()}">
                        <p class="text-center">
                            No hay constantes registradas.
                        </p>
                    </div>

                    <table class="table table-striped table-hover"
                           th:if="${constantes != null and !constantes.isEmpty()}">

                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Atributo</th>
                                <th>Valor</th>
                                <th>Descripción</th>
                                <th>Activo</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr th:each="constante : ${constantes}">

                                <td th:text="${constante.idConstante}"></td>

                                <td th:text="${constante.atributo}"></td>

                                <td th:text="${constante.valor}"></td>

                                <td th:text="${constante.descripcion}"></td>

                                <td>
                                    <span th:if="${constante.activo}"
                                          class="badge bg-success">
                                        Activo
                                    </span>

                                    <span th:if="${!constante.activo}"
                                          class="badge bg-danger">
                                        Inactivo
                                    </span>
                                </td>

                                <td>
                                    <a th:href="@{/constante/modificar/{idConstante}(idConstante=${constante.idConstante})}"
                                       class="btn btn-warning btn-sm mb-1">
                                        <i class="fa-solid fa-pen-to-square"></i>
                                        Modificar
                                    </a>

                                    <button type="button"
                                            class="btn btn-danger btn-sm mb-1"
                                            data-bs-toggle="modal"
                                            th:data-bs-target="${'#eliminarConstante' + constante.idConstante}">
                                        <i class="fa-solid fa-trash"></i>
                                        Eliminar
                                    </button>
                                </td>

                            </tr>
                        </tbody>

                    </table>

                </div>
            </div>

        </section>


        <!-- Fragmento confirmar eliminación -->
        <section th:fragment="confirmarEliminar">

            <div th:each="constante : ${constantes}">

                <div class="modal fade"
                     th:id="${'eliminarConstante' + constante.idConstante}"
                     tabindex="-1"
                     aria-hidden="true">

                    <div class="modal-dialog">
                        <div class="modal-content">

                            <form th:action="@{/constante/eliminar}" method="post">

                                <div class="modal-header bg-danger text-white">
                                    <h5 class="modal-title">
                                        Confirmar eliminación
                                    </h5>

                                    <button type="button"
                                            class="btn-close"
                                            data-bs-dismiss="modal"
                                            aria-label="Close">
                                    </button>
                                </div>

                                <div class="modal-body">
                                    <input type="hidden"
                                           name="idConstante"
                                           th:value="${constante.idConstante}"/>

                                    <p>
                                        ¿Está segura de que desea eliminar la constante?
                                    </p>

                                    <strong th:text="${constante.atributo}"></strong>
                                </div>

                                <div class="modal-footer">
                                    <button type="button"
                                            class="btn btn-secondary"
                                            data-bs-dismiss="modal">
                                        Cancelar
                                    </button>

                                    <button type="submit"
                                            class="btn btn-danger">
                                        Eliminar
                                    </button>
                                </div>

                            </form>

                        </div>
                    </div>
                </div>

            </div>

        </section>

    </body>
</html>
